name: Publish Neo update mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable Neo release tag to mirror
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-neo-update-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # The job holds the mirror's FTP credentials. Only run the deploy script as
    # reviewed on the default branch: manual runs must start from it, and
    # release runs check it out rather than the tagged commit.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'release' &&
      !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    environment: Helium_Neo_App
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-neo$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Expected a published stable release") else "Stable release confirmed" end'
          gh release download "$RELEASE_TAG" --dir mirror-assets \
            --pattern 'Helium-Neo-*-macOS-arm64-signed.dmg' \
            --pattern helium-neo.xml --pattern helium-neo-backup.xml \
            --pattern update-manifest.json
      - name: Upload and verify installer, then publish backup appcast
        env:
          HELIUM_NEO_FTP_HOST: ${{ secrets.HELIUM_NEO_FTP_HOST }}
          HELIUM_NEO_FTP_PORT: ${{ secrets.HELIUM_NEO_FTP_PORT }}
          HELIUM_NEO_FTP_USERNAME: ${{ secrets.HELIUM_NEO_FTP_USERNAME }}
          HELIUM_NEO_FTP_PASSWORD: ${{ secrets.HELIUM_NEO_PASSWORD }}
        run: python3 devutils/macos/deploy_mirror.py mirror-assets --retain 5
